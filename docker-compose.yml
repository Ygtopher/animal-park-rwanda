version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: animal_park_db
    environment:
      POSTGRES_DB: animal_park
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  backend:
    build: ./backend
    container_name: animal_park_backend
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/animal_park
      JWT_SECRET: your_super_secret_jwt_key_change_this_in_production
      JWT_EXPIRES_IN: 7d
      PORT: 5000
      NODE_ENV: production
      FRONTEND_URL: http://localhost:3000
    ports:
      - "5000:5000"
    depends_on:
      - postgres
    restart: unless-stopped
    command: sh -c "sleep 10 && npm start"

  frontend:
    build: ./frontend
    container_name: animal_park_frontend
    environment:
      VITE_API_URL: http://localhost:5000
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
